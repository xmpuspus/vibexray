name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev
      - name: Test
        run: uv run pytest -q -m "not corpus and not browser"
      - name: Build
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  smoke:
    name: Fresh-venv install and CLI smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the wheel in a clean venv
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
      - name: Run every command
        run: |
          mkdir -p /tmp/tiny-app
          printf 'print("hello")\n' > /tmp/tiny-app/app.py
          /tmp/smoke-venv/bin/vibexray --version
          /tmp/smoke-venv/bin/vibexray rules
          /tmp/smoke-venv/bin/vibexray scan /tmp/tiny-app --out /tmp/tiny-out --no-run --no-history
          test -f /tmp/tiny-out/report.html
          test -f /tmp/tiny-out/handoff.md
          test -f /tmp/tiny-out/vibexray.json

  publish:
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
